<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533" width="400" height="533">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#1A0F2E"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="2" x2="4" y2="2" stroke="#00F0FF" stroke-opacity="0.04" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="400" height="533" fill="url(#bg)"/>
  <rect width="400" height="533" fill="url(#halo)"/>
  <rect width="400" height="533" fill="url(#scan)"/>

  <!-- specimen frame -->
  <rect x="60" y="100" width="280" height="350" fill="none" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="64" y="104" width="272" height="342" fill="none" stroke="#00F0FF" stroke-opacity="0.15" stroke-width="0.5"/>

  <!-- corner brackets -->
  <g stroke="#00F0FF" stroke-width="2" fill="none">
    <path d="M50 95 L50 110 M50 95 L65 95"/>
    <path d="M350 95 L350 110 M350 95 L335 95"/>
    <path d="M50 455 L50 440 M50 455 L65 455"/>
    <path d="M350 455 L350 440 M350 455 L335 455"/>
  </g>

  <!-- center icon: card stack silhouette -->
  <g transform="translate(200 275)" stroke="#00F0FF" stroke-opacity="0.5" fill="none" stroke-width="1.5">
    <rect x="-50" y="-65" width="100" height="130" rx="6"/>
    <rect x="-44" y="-59" width="88" height="118" rx="4" stroke-opacity="0.3"/>
    <line x1="-30" y1="-35" x2="30" y2="-35" stroke-opacity="0.4"/>
    <line x1="-30" y1="-20" x2="20" y2="-20" stroke-opacity="0.3"/>
    <circle cx="0" cy="20" r="22" stroke-opacity="0.4"/>
  </g>

  <!-- top label -->
  <text x="200" y="80" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#00F0FF" letter-spacing="2">// SPECIMEN_PENDING</text>

  <!-- bottom label -->
  <text x="200" y="490" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#9ca3af" letter-spacing="2">&gt; PHOTO_INCOMING</text>
  <text x="200" y="505" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#9ca3af" fill-opacity="0.7" letter-spacing="1.5">CATALOGUED · NOT_YET_IMAGED</text>
</svg>
